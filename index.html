<style>
  html, body { margin: 0; height: 100%; background: #101018; color: #ddd; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; padding: 0 16px; font-size: 12px; align-items: center; opacity: .75; }
  #bar button, #bar select { font-size: 12px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  #bar button:hover { background: #333; }
  #loading { position: absolute; font: 14px monospace; color: #aaa; }
  #chat { width: min(480px, calc(100vw - 32px)); margin-top: 8px; font-size: 12px; }
  #chatLog { height: 96px; overflow-y: auto; background: #181820; border: 1px solid #333; border-radius: 4px; padding: 4px 6px; color: #ccc; }
  #chatLog b { color: #8fb8ff; font-weight: 600; } #chatLog b.me { color: #f8d030; }
  #chatRow { display: flex; gap: 6px; margin-top: 4px; }
  #chatRow input { flex: 1; min-width: 0; font-size: 12px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; }
  #chatRow select, #chatRow button { font-size: 12px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  #chatNote { min-height: 14px; color: #f0a060; margin-top: 2px; }
  /* ---- phones and tablets (src/core/touch.js) ---- */
  body.touch { justify-content: flex-start; padding-top: 6px; touch-action: manipulation; -webkit-user-select: none; user-select: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body.touch #screen { touch-action: none; }
  body.touch #bar > span:first-child, body.touch #scaleSel, body.touch #scaleNote { display: none; }
  #touch { position: relative; width: 100%; max-width: 520px; height: 220px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-sizing: border-box; }
  #touch button { font-family: system-ui, sans-serif; color: #ddd; border: none; touch-action: none; }
  #touch .pad { position: relative; width: 150px; height: 150px; touch-action: none; }
  #touch .arm, #touch .hub { position: absolute; background: #2a2a34; box-shadow: inset 0 -3px 0 #16161c; }
  #touch .up, #touch .down { left: 50px; width: 50px; height: 56px; }
  #touch .up { top: 0; border-radius: 8px 8px 0 0; } #touch .down { bottom: 0; border-radius: 0 0 8px 8px; }
  #touch .left, #touch .right { top: 50px; width: 56px; height: 50px; }
  #touch .left { left: 0; border-radius: 8px 0 0 8px; } #touch .right { right: 0; border-radius: 0 8px 8px 0; }
  #touch .hub { left: 50px; top: 50px; width: 50px; height: 50px; box-shadow: none; }
  #touch .pad[data-dir="UP"] .up, #touch .pad[data-dir="DOWN"] .down, #touch .pad[data-dir="LEFT"] .left, #touch .pad[data-dir="RIGHT"] .right { background: #4a4a5c; }
  #touch .mid { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 14px; }
  #touch .pill { width: 62px; height: 22px; border-radius: 11px; background: #2a2a34; font-size: 10px; letter-spacing: 1px; }
  #touch .ab { position: relative; width: 150px; height: 130px; }
  #touch .round { position: absolute; width: 66px; height: 66px; border-radius: 50%; background: #8a2040; font-size: 20px; font-weight: 700; box-shadow: inset 0 -4px 0 #5a1028; }
  #touch .round.a { right: 0; top: 4px; } #touch .round.b { left: 0; bottom: 4px; }
  #touch .on { filter: brightness(1.5); }
  @media (orientation: landscape) {
    body.touch #touch { position: fixed; inset: 0; max-width: none; height: auto; padding: 0 2vw; pointer-events: none; }
    body.touch #touch > * { pointer-events: auto; }
    body.touch #touch .mid { bottom: 8px; }
  }
</style>
</head>
<body>
<div id="loading">Loading GEGK Adventure…</div>
<canvas id="screen" width="240" height="160" tabindex="0"></canvas>
<div id="bar">
  <span>Scale</span>
  <select id="scaleSel"><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option><option value="6">6×</option><option value="8">8×</option></select><span id="scaleNote"></span>
  <button id="btnExport" title="Download all save slots as a JSON backup">Export saves</button>
  <button id="btnImport" title="Load save slots from a JSON backup">Import saves</button>
  <button id="btnMute" title="Toggle sound (M)">Sound: on</button>
  <button id="btnCloud">Sign in to sync saves</button>
  <span id="cloudStatus"></span>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>
