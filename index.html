<style>
  html, body { margin: 0; height: 100%; background: #101018; color: #ddd; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; outline: none; }
  #bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; padding: 0 16px; font-size: 12px; align-items: center; opacity: .75; }
  #bar button, #bar select { font-size: 12px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  #bar button:hover { background: #333; }
  #loading { position: absolute; font: 14px monospace; color: #aaa; }
  #chat { width: min(480px, calc(100vw - 32px)); margin-top: 8px; font-size: 12px; }
  #chatLog { height: 96px; overflow-y: auto; background: #181820; border: 1px solid #333; border-radius: 4px; padding: 4px 6px; color: #ccc; }
  #chatLog b { color: #8fb8ff; font-weight: 600; } #chatLog b.me { color: #f8d030; }
  #chatRow { display: flex; gap: 6px; margin-top: 4px; }
  #chatRow input { flex: 1; min-width: 0; font-size: 12px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 3px 6px; }
  #chatRow select, #chatRow button { font-size: 12px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 2px 6px; cursor: pointer; }
  #chatNote { min-height: 14px; color: #f0a060; margin-top: 2px; }
  /* ---- phones and tablets (src/core/touch.js) ---- */
  body.touch { justify-content: flex-start; padding: env(safe-area-inset-top) 0 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    --t-fill: rgba(42, 42, 52, 0.62); --t-edge: rgba(170, 170, 190, 0.75); --t-lit: rgba(120, 120, 140, 0.85);
    --t-red: rgba(138, 32, 64, 0.62); --t-red-edge: rgba(225, 110, 150, 0.85); --t-text: #e8e8f0; }
  body.touch #screen { touch-action: none; }
  body.touch #bar > span:first-child, body.touch #scaleSel, body.touch #scaleNote { display: none; }
  #touch { position: relative; width: 100%; max-width: 560px; height: 270px; }
  #touch button { position: absolute; font-family: system-ui, sans-serif; font-weight: 700; color: var(--t-text); touch-action: none;
    background: var(--t-fill); border: 2px solid var(--t-edge); padding: 0; }
  #touch .on { filter: brightness(1.6); }
  #touch .shoulder { top: 8px; width: 96px; height: 40px; border-radius: 20px; font-size: 20px; }
  #touch .shoulder.l { left: 12px; } #touch .shoulder.r { right: 12px; }
  #touch .menu { display: none; top: 8px; left: 50%; transform: translateX(-50%); height: 30px; padding: 0 16px; border-radius: 15px; font-size: 13px; letter-spacing: 1px; }
  #touch .pad { position: absolute; left: 14px; top: 64px; width: 156px; height: 156px; touch-action: none; }
  #touch .pad svg { width: 100%; height: 100%; display: block; }
  #touch .cross { fill: var(--t-fill); stroke: var(--t-edge); stroke-width: 3; }
  #touch .lit { fill: transparent; }
  #touch .pad[data-dir="UP"] .UP, #touch .pad[data-dir="DOWN"] .DOWN, #touch .pad[data-dir="LEFT"] .LEFT, #touch .pad[data-dir="RIGHT"] .RIGHT { fill: var(--t-lit); }
  #touch .chev { fill: none; stroke: var(--t-text); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
  #touch .ring { fill: none; stroke: var(--t-text); stroke-width: 3; opacity: 0.8; }
  #touch .ab { position: absolute; right: 12px; top: 58px; width: 176px; height: 176px; }
  #touch .round { width: 82px; height: 82px; border-radius: 50%; font-size: 34px; background: var(--t-red); border-color: var(--t-red-edge); }
  #touch .round.a { right: 0; top: 0; } #touch .round.b { left: 0; top: 66px; }
  #touch .combo { right: 0; bottom: 0; width: 64px; height: 56px; border-radius: 14px 14px 14px 36px; font-size: 18px; background: var(--t-red); border-color: var(--t-red-edge); }
  #touch .mid { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 230px; height: 34px; }
  #touch .pill { top: 0; width: 104px; height: 32px; border-radius: 16px; font-size: 13px; letter-spacing: 1px; }
  #touch .pill[data-b="SELECT"] { left: 0; } #touch .pill[data-b="START"] { right: 0; }
  /* landscape: the game fills the screen and the buttons float over its sides */
  @media (orientation: landscape) {
    body.touch { overflow: hidden; height: 100%; padding: 0; }
    body.touch #screen { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    body.touch #bar, body.touch #chat { display: none; }
    body.touch #touch { position: fixed; inset: 0; max-width: none; height: auto; pointer-events: none; }
    body.touch #touch > * { pointer-events: auto; }
    body.touch #touch .shoulder.l { left: calc(14px + env(safe-area-inset-left)); }
    body.touch #touch .shoulder.r { right: calc(14px + env(safe-area-inset-right)); }
    body.touch #touch .menu { display: block; }
    body.touch #touch .pad { top: auto; bottom: calc(16px + env(safe-area-inset-bottom)); left: calc(18px + env(safe-area-inset-left)); }
    body.touch #touch .ab { top: auto; bottom: calc(14px + env(safe-area-inset-bottom)); right: calc(14px + env(safe-area-inset-right)); }
    body.touch #touch .mid { bottom: calc(10px + env(safe-area-inset-bottom)); }
    /* MENU shows the save / sign-in / chat bar over the game */
    body.touch.menu-open #bar, body.touch.menu-open #chat { display: flex; position: fixed; left: 50%; transform: translateX(-50%); z-index: 5;
      background: rgba(16, 16, 24, 0.94); border: 1px solid #444; border-radius: 8px; padding: 8px; opacity: 1; }
    body.touch.menu-open #bar { top: 48px; width: min(560px, 80vw); box-sizing: border-box; }
    body.touch.menu-open #chat[hidden] { display: none; }
    body.touch.menu-open #chat { top: 100px; flex-direction: column; width: min(560px, 80vw); box-sizing: border-box; margin: 0; }
  }
</style>

<script>
  // Phones keep the page for up to 10 minutes after a new version goes live.
  // Check the live page's version and, if it's newer, load it (a ?v= address
  // isn't in the browser's cache). The publish step fills in the version.
  window.GEGK_BUILD = 'c7b6e8f';
  (function () {
    if (location.protocol === 'file:' || /^__/.test(window.GEGK_BUILD)) return;
    fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      var m = t.match(/GEGK_BUILD = '([^']+)'/);
      if (!m || m[1] === window.GEGK_BUILD) return;
      try { if (sessionStorage.getItem('gegk-updated-' + m[1])) return; sessionStorage.setItem('gegk-updated-' + m[1], '1'); } catch (e) { return; }
      var q = location.search.replace(/[?&]v=[^&]*/, '').replace(/^&/, '?');
      location.replace(location.pathname + (q ? q + '&' : '?') + 'v=' + m[1] + location.hash);
    }).catch(function () {});
  })();
</script>

  <span id="cloudStatus"></span>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>
